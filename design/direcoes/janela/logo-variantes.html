<body>
<!-- A: arcos concêntricos (versão do esboço) -->
<p>A — arcos concêntricos</p>
<div class="linha">

<div class="linha">
	<svg width="160" height="160" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 58V30a22 22 0 0 1 44 0v28Z"/><path d="M32 36a3 3 0 0 1 6 0a6 6 0 0 1-12 0a9 9 0 0 1 18 0c0 6.5-5.4 11-12 11s-12-4.5-12-11"/><path d="M32 47v11"/></svg>
