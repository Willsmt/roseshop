name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy-production:
    name: deploy em produção
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://roseshop.willsmt.workers.dev
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrations (Neon production)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f src/lib/db/migrations/meta/_journal.json ]; then
            npm run db:migrate
          else
            echo "Nenhuma migration ainda."
          fi
      - name: Deploy (roseshop)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:production
      - name: Smoke test
        run: ./scripts/smoke-health.sh https://roseshop.willsmt.workers.dev/api/health
