name: pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy-dev:
    name: deploy no dev
    needs: checks
    # PR de fork nunca recebe secrets nem faz deploy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment:
      name: dev
      url: https://roseshop-dev.willsmt.workers.dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrations (Neon dev)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f src/lib/db/migrations/meta/_journal.json ]; then
            npm run db:migrate
          else
            echo "Nenhuma migration ainda."
          fi
      - name: Deploy (roseshop-dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:dev
      - name: Smoke test
        run: ./scripts/smoke-health.sh https://roseshop-dev.willsmt.workers.dev/api/health
